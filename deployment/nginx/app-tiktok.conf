# app-tiktok.kentangtech.com: TLS at the edge, app-ui on /, app-serve on /api/v1.
# The webhook route is version-independent, so it gets its own location next
# to the versioned API block. Replace /etc/letsencrypt paths if the certs move.
upstream app_serve {
    server app-serve:8080 max_fails=3 fail_timeout=30s;
}

upstream app_ui {
    server app-ui:3000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name app-tiktok.kentangtech.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app-tiktok.kentangtech.com;

    ssl_certificate /etc/letsencrypt/live/app-tiktok.kentangtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app-tiktok.kentangtech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64m;

    location = /api/v1 {
        return 301 /api/v1/;
    }

    location /api/v1/ {
        proxy_pass http://app_serve/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /webhooks/tiktok {
        proxy_pass http://app_serve/webhooks/tiktok;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://app_ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
